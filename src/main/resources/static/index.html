<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Театр - бронирование</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #e94560;
        }
        .user-info {
            text-align: right;
            margin-bottom: 20px;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }
        .stats-panel {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            background: #e94560;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        button:hover {
            background: #ff6b81;
            transform: translateY(-2px);
        }
        .stats-info {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }
        .hall {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 20px;
        }
        .row {
            margin-bottom: 15px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
        }
        .row-title {
            font-weight: bold;
            min-width: 70px;
            color: #e94560;
        }
        .seats-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .seat {
            width: 55px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
            border: 2px solid rgba(255,255,255,0.3);
        }
        .seat.free {
            background-color: #2ecc71;
        }
        .seat.free:hover {
            background-color: #27ae60;
            transform: scale(1.05);
        }
        .seat.hold {
            background-color: #f39c12;
            cursor: wait;
        }
        .seat.booked {
            background-color: #e74c3c;
            cursor: not-allowed;
            opacity: 0.7;
        }
        .message {
            text-align: center;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
        .message.success {
            background: rgba(46,204,113,0.2);
            border: 1px solid #2ecc71;
            color: #2ecc71;
        }
        .message.error {
            background: rgba(231,76,60,0.2);
            border: 1px solid #e74c3c;
            color: #e74c3c;
        }
        .message.info {
            background: rgba(52,152,219,0.2);
            border: 1px solid #3498db;
            color: #3498db;
        }
        .loading {
            text-align: center;
            padding: 40px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Театр - схема зала</h1>

    <div class="user-info">
        <span th:text="${#authentication.name}"></span>
        <button onclick="location.href='/auth/logout'">Выйти</button>
    </div>

    <div class="stats-panel">
        <button id="statsBtn">Статистика</button>
        <button id="refreshBtn">Обновить схему</button>
    </div>

    <div id="stats" class="stats-info"></div>
    <div id="hall" class="hall"></div>
    <div id="message" class="message"></div>
</div>

<script>
    let seats = [];
    let refreshInterval = null;

    async function loadSeats() {
        try {
            const response = await fetch('/api/seats');
            if (!response.ok) {
                if (response.status === 401) {
                    window.location.href = '/auth/login';
                    return;
                }
                throw new Error('Ошибка загрузки');
            }
            seats = await response.json();
            renderHall();
        } catch (error) {
            console.error('Ошибка загрузки мест:', error);
            showMessage('Ошибка загрузки схемы зала', 'error');
        }
    }

    function renderHall() {
        const hallDiv = document.getElementById('hall');
        hallDiv.innerHTML = '';

        if (!seats.length) {
            hallDiv.innerHTML = '<div class="loading">Загрузка...</div>';
            return;
        }

        let currentRow = 0;
        let rowDiv = null;
        let seatsRow = null;

        for (const seat of seats) {
            if (seat.row !== currentRow) {
                currentRow = seat.row;
                rowDiv = document.createElement('div');
                rowDiv.className = 'row';

                const title = document.createElement('div');
                title.className = 'row-title';
                title.innerText = 'Ряд ' + currentRow;
                rowDiv.appendChild(title);

                seatsRow = document.createElement('div');
                seatsRow.className = 'seats-row';
                rowDiv.appendChild(seatsRow);

                hallDiv.appendChild(rowDiv);
            }

            const seatDiv = document.createElement('div');
            let statusClass = '';
            if (seat.status === 'FREE') statusClass = 'free';
            else if (seat.status === 'HOLD') statusClass = 'hold';
            else statusClass = 'booked';

            seatDiv.className = 'seat ' + statusClass;
            seatDiv.innerText = seat.number;

            if (seat.status === 'FREE') {
                seatDiv.onclick = (function(id) {
                    return function() { startBooking(id); };
                })(seat.id);
            } else if (seat.status === 'HOLD') {
                seatDiv.title = 'Временно забронировано';
            } else {
                seatDiv.title = 'Уже занято';
            }

            seatsRow.appendChild(seatDiv);
        }
    }

    async function startBooking(seatId) {
        try {
            showMessage('Бронирование места... Пожалуйста, подождите', 'info');

            // Шаг 1: Временное резервирование
            const holdResponse = await fetch('/api/seats/' + seatId + '/hold', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            });

            const holdData = await holdResponse.json();

            if (!holdResponse.ok) {
                showMessage(holdData.message || 'Не удалось забронировать место', 'error');
                loadSeats();
                return;
            }

            showMessage(holdData.message, 'info');

            // Шаг 2: Запрос данных пользователя
            const name = prompt('Введите ваше имя:');
            if (!name || name.trim() === '') {
                cancelHold(seatId);
                return;
            }

            const phone = prompt('Введите ваш телефон:');
            if (!phone || phone.trim() === '') {
                cancelHold(seatId);
                return;
            }

            showMessage('Подтверждение бронирования...', 'info');

            // Шаг 3: Подтверждение бронирования
            const confirmResponse = await fetch('/api/seats/' + seatId + '/confirm', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    customerName: name.trim(),
                    customerPhone: phone.trim()
                })
            });

            const confirmData = await confirmResponse.json();

            if (confirmResponse.ok) {
                showMessage('Билет №' + confirmData.ticketId + ' успешно оформлен!', 'success');
                loadSeats();
                loadStats();
            } else {
                showMessage(confirmData.message || 'Ошибка при подтверждении', 'error');
                loadSeats();
            }

        } catch (error) {
            console.error('Ошибка:', error);
            showMessage('Ошибка соединения с сервером', 'error');
            loadSeats();
        }
    }

    async function cancelHold(seatId) {
        try {
            await fetch('/api/seats/' + seatId + '/cancel-hold', { method: 'POST' });
            showMessage('Бронирование отменено', 'info');
            loadSeats();
        } catch (error) {
            console.error('Ошибка отмены:', error);
        }
    }

    async function loadStats() {
        try {
            const response = await fetch('/api/stats');
            const stats = await response.json();
            document.getElementById('stats').innerHTML =
                'Всего мест: ' + stats.totalSeats + ' | ' +
                'Занято: ' + stats.bookedSeats + ' | ' +
                'Свободно: ' + stats.freeSeats + ' | ' +
                'Занятость: ' + stats.occupancyPercentage + '%';
        } catch (error) {
            console.error('Ошибка загрузки статистики:', error);
        }
    }

    function showMessage(msg, type) {
        const msgDiv = document.getElementById('message');
        msgDiv.textContent = msg;
        msgDiv.className = 'message ' + type;
        setTimeout(() => {
            if (msgDiv.textContent === msg) {
                msgDiv.textContent = '';
                msgDiv.className = 'message';
            }
        }, 5000);
    }

    function startAutoRefresh() {
        if (refreshInterval) clearInterval(refreshInterval);
        refreshInterval = setInterval(() => {
            loadSeats();
            loadStats();
        }, 5000);
    }

    document.getElementById('statsBtn').onclick = loadStats;
    document.getElementById('refreshBtn').onclick = () => {
        loadSeats();
        loadStats();
        showMessage('Схема обновлена', 'info');
    };

    startAutoRefresh();
    loadSeats();
    loadStats();
</script>
</body>
</html>
