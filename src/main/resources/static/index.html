<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Театр - бронирование мест</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #e94560;
        }
        .user-info {
            text-align: right;
            margin-bottom: 20px;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }
        .user-info span {
            margin-right: 15px;
        }
        .stats-panel {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            background: #e94560;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        button:hover {
            background: #ff6b81;
            transform: translateY(-2px);
        }
        .stats-info {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }
        .hall {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 20px;
        }
        .row {
            margin-bottom: 15px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
        }
        .row-title {
            font-weight: bold;
            min-width: 70px;
            color: #e94560;
        }
        .seats-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .seat {
            width: 55px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
            border: 2px solid rgba(255,255,255,0.3);
        }
        .seat.free {
            background-color: #2ecc71;
        }
        .seat.free:hover {
            background-color: #27ae60;
            transform: scale(1.05);
        }
        .seat.hold {
            background-color: #f39c12;
            cursor: pointer;
        }
        .seat.hold:hover {
            background-color: #e67e22;
        }
        .seat.booked {
            background-color: #e74c3c;
            cursor: not-allowed;
            opacity: 0.7;
        }
        .message {
            text-align: center;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
        .message.success {
            background: rgba(46,204,113,0.2);
            border: 1px solid #2ecc71;
            color: #2ecc71;
        }
        .message.error {
            background: rgba(231,76,60,0.2);
            border: 1px solid #e74c3c;
            color: #e74c3c;
        }
        .message.info {
            background: rgba(52,152,219,0.2);
            border: 1px solid #3498db;
            color: #3498db;
        }
        .loading {
            text-align: center;
            padding: 40px;
        }
        .booking-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin: 5px 0;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
        }
        .booking-item button {
            padding: 5px 15px;
            font-size: 12px;
        }
        .card {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
        }
        .card h2 {
            margin-bottom: 15px;
            color: #e94560;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Театр - схема зала</h1>

    <div class="user-info">
        <span th:text="${#authentication.name}"></span>
        <button onclick="location.href='/auth/logout'">Выйти</button>
    </div>

    <div class="stats-panel">
        <button id="statsBtn">Статистика</button>
        <button id="refreshBtn">Обновить схему</button>
        <button id="myBookingsBtn">Мои бронирования</button>
    </div>

    <div id="stats" class="stats-info"></div>
    <div id="hall" class="hall"></div>
    <div id="message" class="message"></div>

    <div id="myBookingsCard" class="card" style="display: none;">
        <h2>Мои бронирования</h2>
        <div id="myBookingsList"></div>
    </div>
</div>

<script>
    let seats = [];
    let eventSource = null;
    let pendingSeatId = null; // Сохраняем ID места, которое пользователь начал бронировать
    let refreshInterval = null;

    // Функция принудительного обновления схемы с сервера
    async function refreshSeats() {
        try {
            const response = await fetch('/api/seats');
            if (!response.ok) throw new Error('Ошибка загрузки');
            const newSeats = await response.json();

            if (JSON.stringify(seats) !== JSON.stringify(newSeats)) {
                seats = newSeats;
                renderHall();
                console.log('Схема обновлена, мест: ' + seats.length);
            }
        } catch (error) {
            console.error('Ошибка обновления схемы:', error);
        }
    }

    function renderHall() {
        const hallDiv = document.getElementById('hall');
        hallDiv.innerHTML = '';

        if (!seats || !seats.length) {
            hallDiv.innerHTML = '<div class="loading">Загрузка...</div>';
            return;
        }

        let currentRow = 0;
        let rowDiv = null;
        let seatsRow = null;

        for (const seat of seats) {
            if (seat.row !== currentRow) {
                currentRow = seat.row;
                rowDiv = document.createElement('div');
                rowDiv.className = 'row';

                const title = document.createElement('div');
                title.className = 'row-title';
                title.innerText = 'Ряд ' + currentRow;
                rowDiv.appendChild(title);

                seatsRow = document.createElement('div');
                seatsRow.className = 'seats-row';
                rowDiv.appendChild(seatsRow);

                hallDiv.appendChild(rowDiv);
            }

            const seatDiv = document.createElement('div');
            let statusClass = '';
            if (seat.status === 'FREE') statusClass = 'free';
            else if (seat.status === 'HOLD') statusClass = 'hold';
            else statusClass = 'booked';

            seatDiv.className = 'seat ' + statusClass;
            seatDiv.innerText = seat.number;

            // FREE место - можно начать бронирование
            if (seat.status === 'FREE') {
                seatDiv.onclick = (function(id) {
                    return function() { startBooking(id); };
                })(seat.id);
            }
            // HOLD место - можно продолжить бронирование (если это наше ожидающее место)
            else if (seat.status === 'HOLD') {
                if (pendingSeatId === seat.id) {
                    seatDiv.title = 'Продолжить бронирование';
                    seatDiv.onclick = (function(id) {
                        return function() { continueBooking(id); };
                    })(seat.id);
                } else {
                    seatDiv.title = 'Временно забронировано другим пользователем';
                    seatDiv.onclick = null;
                }
            }
            // BOOKED место - нельзя занять
            else {
                seatDiv.title = 'Уже занято';
                seatDiv.onclick = null;
            }

            seatsRow.appendChild(seatDiv);
        }
    }

    // Начать новое бронирование
    async function startBooking(seatId) {
        pendingSeatId = seatId;

        try {
            showMessage('Бронирование места...', 'info');

            const holdResponse = await fetch('/api/seats/' + seatId + '/hold', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            });

            const holdData = await holdResponse.json();

            if (!holdResponse.ok) {
                showMessage(holdData.message || 'Не удалось забронировать место', 'error');
                pendingSeatId = null;
                await refreshSeats();
                return;
            }

            await refreshSeats();

            // Переходим к вводу данных
            await showBookingDialog(seatId);

        } catch (error) {
            console.error('Ошибка:', error);
            showMessage('Ошибка соединения с сервером', 'error');
            pendingSeatId = null;
            await refreshSeats();
        }
    }

    // Продолжить ранее начатое бронирование
    async function continueBooking(seatId) {
        showMessage('Продолжение бронирования...', 'info');
        await showBookingDialog(seatId);
    }

    // Диалог ввода данных и подтверждение
    async function showBookingDialog(seatId) {
        const name = prompt('Введите ваше имя:');
        if (!name || name.trim() === '') {
            await cancelHold(seatId);
            return;
        }

        const phone = prompt('Введите ваш телефон (только цифры, минимум 10):');
        if (!phone || phone.trim() === '') {
            await cancelHold(seatId);
            return;
        }

        const cleanPhone = phone.replace(/[^0-9]/g, '');
        if (cleanPhone.length < 10) {
            showMessage('Введите корректный номер телефона (минимум 10 цифр)', 'error');
            await cancelHold(seatId);
            return;
        }

        showMessage('Подтверждение бронирования...', 'info');

        try {
            const confirmResponse = await fetch('/api/seats/' + seatId + '/confirm', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    customerName: name.trim(),
                    customerPhone: cleanPhone
                })
            });

            const confirmData = await confirmResponse.json();

            if (confirmResponse.ok) {
                showMessage('Билет №' + confirmData.ticketId + ' успешно оформлен!', 'success');
                pendingSeatId = null;
                await refreshSeats();
                await loadMyBookings();
            } else {
                showMessage(confirmData.message || 'Ошибка при подтверждении', 'error');
                await cancelHold(seatId);
            }
        } catch (error) {
            console.error('Ошибка:', error);
            showMessage('Ошибка соединения с сервером', 'error');
            await cancelHold(seatId);
        }
    }

    async function cancelHold(seatId) {
        try {
            await fetch('/api/seats/' + seatId + '/cancel-hold', { method: 'POST' });
            showMessage('Бронирование отменено', 'info');
            pendingSeatId = null;
            await refreshSeats();
        } catch (error) {
            console.error('Ошибка отмены:', error);
        }
    }

    function startSSE() {
        if (eventSource) {
            eventSource.close();
        }

        eventSource = new EventSource('/api/seats/stream');

        eventSource.addEventListener('seats-update', function(event) {
            console.log('SSE обновление получено');
            seats = JSON.parse(event.data);
            renderHall();
        });

        eventSource.onerror = function() {
            console.error('SSE ошибка');
        };
    }

    async function loadStats() {
        try {
            const response = await fetch('/api/stats');
            const stats = await response.json();
            document.getElementById('stats').innerHTML =
                'Всего мест: ' + stats.totalSeats + ' | ' +
                'Занято: ' + stats.bookedSeats + ' | ' +
                'Свободно: ' + stats.freeSeats + ' | ' +
                'Занятость: ' + stats.occupancyPercentage + '%';
        } catch (error) {
            console.error('Ошибка загрузки статистики:', error);
        }
    }

    async function loadMyBookings() {
        try {
            const response = await fetch('/api/my/bookings');
            const bookings = await response.json();

            const card = document.getElementById('myBookingsCard');
            const listDiv = document.getElementById('myBookingsList');

            if (!bookings || bookings.length === 0) {
                card.style.display = 'none';
                return;
            }

            card.style.display = 'block';
            listDiv.innerHTML = '';

            bookings.forEach(booking => {
                const item = document.createElement('div');
                item.className = 'booking-item';
                item.innerHTML = `<span>Место: ряд ${booking.row}, место ${booking.number}</span>
                                  <button onclick="cancelBooking(${booking.seatId})">Отменить</button>`;
                listDiv.appendChild(item);
            });

        } catch (error) {
            console.error('Ошибка загрузки броней:', error);
        }
    }

    async function cancelBooking(seatId) {
        if (confirm('Отменить бронирование?')) {
            const response = await fetch('/api/seats/' + seatId + '/release', { method: 'POST' });
            if (response.ok) {
                showMessage('Бронирование отменено, место освобождено', 'success');
                await refreshSeats();
                await loadMyBookings();
            } else {
                showMessage('Ошибка отмены бронирования', 'error');
            }
        }
    }

    function showMessage(msg, type) {
        const msgDiv = document.getElementById('message');
        msgDiv.textContent = msg;
        msgDiv.className = 'message ' + type;
        setTimeout(() => {
            if (msgDiv.textContent === msg) {
                msgDiv.textContent = '';
                msgDiv.className = 'message';
            }
        }, 5000);
    }

    document.getElementById('statsBtn').onclick = loadStats;
    document.getElementById('refreshBtn').onclick = refreshSeats;
    document.getElementById('myBookingsBtn').onclick = loadMyBookings;

    startSSE();
    refreshSeats();
    refreshInterval = setInterval(refreshSeats, 3000);
    loadStats();
    loadMyBookings();
</script>
</body>
</html>
